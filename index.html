
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的手機 AR 虛擬長輩原型</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="status">正在準備 AR，請稍候……</div>

  <a-scene
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;
                  autoStart: true;
                  uiLoading: yes;
                  uiScanning: yes;
                  uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets>
      <a-asset-item
        id="grandpaModel"
        src="./assets/grandpa.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 辨識到圖片後，才顯示老人模型 -->
    <a-entity
      id="arTarget"
      mindar-image-target="targetIndex: 0">

      <a-entity
        gltf-model="#grandpaModel"
        position="0 -0.35 0"
        rotation="0 0 0"
        scale="0.3 0.3 0.3">
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const statusBox = document.getElementById("status");
    const scene = document.querySelector("a-scene");
    const target = document.getElementById("arTarget");

    scene.addEventListener("loaded", () => {
      statusBox.textContent =
        "場景已載入，請將鏡頭對準官方測試圖片";
    });

    target.addEventListener("targetFound", () => {
      statusBox.textContent =
        "成功辨識圖片！正在顯示虛擬長輩。";
    });

    target.addEventListener("targetLost", () => {
      statusBox.textContent =
        "尚未辨識到圖片，請將鏡頭對準測試圖片";
    });
  </script>
</body>
</html>
